<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ART Racing">
  <title>ART Racing Championship</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <style>
    :root{color-scheme:dark;--text:#f5f7fa;--muted:#aab1bd}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#07090d;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,rgba(215,25,32,.2),transparent 38%),linear-gradient(180deg,#0b0e14,#050609)}
    #site-stop{width:min(680px,100%);text-align:center;padding:clamp(28px,7vw,64px);border:1px solid #2a303d;border-radius:24px;background:rgba(15,19,27,.94);box-shadow:0 24px 70px rgba(0,0,0,.45)}
    img{display:block;width:min(320px,80%);height:auto;margin:0 auto 34px}.code{display:inline-block;margin-bottom:14px;color:#ff858a;font-size:12px;font-weight:900;letter-spacing:.18em}
    h1{margin:0;font-size:clamp(32px,8vw,58px);line-height:1.02}p{margin:20px auto 0;max-width:500px;color:var(--muted);font-size:clamp(15px,3vw,18px);line-height:1.65}
    @media(max-width:520px){body{padding:16px}#site-stop{padding:34px 22px;border-radius:18px}img{margin-bottom:26px}}
  </style>
</head>
<body>
  <main id="site-stop"><img src="assets/art-logo.png" alt="ART Racing Championship"><span class="code">404 · STOP TEMPORANEO</span><h1>Temporaneamente offline</h1><p>Il sito ART Racing Championship è momentaneamente sospeso.</p></main>
  <script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
</body>
</html>
