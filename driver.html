<!doctype html><html lang="it"><head><title>ART Racing · Pilota</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d71920"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="stylesheet" href="styles.css?v=5"></head><body>
<div class="driver-page">
<a href="index.html#piloti" style="display:inline-flex;color:var(--muted);text-decoration:none;font-size:12px;margin-bottom:14px">← Torna ai piloti</a>
<div class="mobile-brand"><img src="assets/art-logo.png" alt="ART Racing Championship"></div>
<section class="driver-profile-hero">
<div class="driver-idblock"><div class="driver-number-xl" id="numBox">#0</div><div class="driver-name-xl"><h1 id="driverName">Pilota</h1><p id="driverPsn"></p><p id="driverTeam"></p><p id="driverCategory"></p></div></div>
<div class="driver-summary" id="summary"></div>
</section>
<div class="driver-detail-grid">
<section class="detail-card"><h2>Informazioni pilota</h2><div class="info-list" id="driverInfo"></div></section>
<section class="detail-card"><h2>Vetture assegnate</h2><div class="info-list" id="carInfo"></div></section>
<section class="detail-card"><h2>Statistiche stagione</h2><div class="info-list" id="statsInfo"></div></section>
<section class="detail-card"><h2>Classifiche</h2><div class="info-list" id="rankingInfo"></div></section>
</div>
<section class="detail-card driver-results"><h2>Risultati e migliori prestazioni</h2><div class="empty-history">Nessun risultato ufficiale ancora registrato per la stagione 2026.</div></section>
<div class="footer">ART Racing Championship · Scheda pilota</div>
</div>
<script src="data.js?v=5"></script><script>
const TEAM_COLORS={Ferrari:"#e10600",Porsche:"#1f6ed4",Nissan:"#ffd400",Toyota:"#ffffff",Mercedes:"#3b424c"};
const CARS={
Ferrari:{gr3:"Ferrari 458 Italia GT3 '13",gr4:"Ferrari 458 Italia Gr.4"},
Nissan:{gr3:"Nissan GT-R NISMO GT3 '18",gr4:"Nissan GT-R Gr.4"},
Toyota:{gr3:"Toyota GR Supra Racing Concept '18",gr4:"Toyota GR Supra Race Car '19"},
Mercedes:{gr3:"Mercedes-AMG GT3 '16",gr4:"Mercedes-AMG GT Gr.4"},
Porsche:{gr3:"Porsche 911 RSR (991) '17",gr4:"Porsche Cayman GT4 Clubsport '16"}
};
const n=Number(new URLSearchParams(location.search).get("numero"));const d=DRIVERS.find(x=>x.number===n)||DRIVERS[0];
const sorted=[...DRIVERS].sort((a,b)=>b.points-a.points||b.wins-a.wins||b.seconds-a.seconds||b.thirds-a.thirds||a.number-b.number);
const catSorted=sorted.filter(x=>x.category===d.category);
const generalPos=sorted.findIndex(x=>x.number===d.number)+1;const catPos=catSorted.findIndex(x=>x.number===d.number)+1;
document.title=`ART Racing · #${d.number} ${d.name}`;document.getElementById("numBox").textContent=`#${d.number}`;document.getElementById("numBox").style.setProperty("--team",TEAM_COLORS[d.team]||"#596474");document.getElementById("driverName").textContent=`${d.flag} ${d.name}`;document.getElementById("driverPsn").textContent=`PSN ID: ${d.psn}`;document.getElementById("driverTeam").textContent=`Scuderia: ${d.team||"Da assegnare"}`;document.getElementById("driverCategory").innerHTML=`Categoria: <strong>${d.category}</strong>`;
const avg=d.races?(d.points/d.races).toFixed(1):"0,0";
document.getElementById("summary").innerHTML=`<div class="summary-card"><span>Punti</span><strong class="pts">${d.points}</strong></div><div class="summary-card"><span>Gare</span><strong>${d.races}</strong></div><div class="summary-card"><span>Media punti</span><strong>${avg}</strong></div><div class="summary-card"><span>Ranking ART</span><strong>${d.ranking??"—"}</strong></div>`;
document.getElementById("driverInfo").innerHTML=[["Numero gara","#"+d.number],["Gamertag",d.name],["PSN ID",d.psn],["Nazionalità",d.flag+" "+d.country],["Categoria",d.category],["Scuderia",d.team||"Da assegnare"]].map(x=>`<div class="info-row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");
const cars=d.team&&CARS[d.team]?CARS[d.team]:null;document.getElementById("carInfo").innerHTML=[["Gr.3",cars?cars.gr3:"Da assegnare"],["Gr.4",cars?cars.gr4:"Da assegnare"]].map(x=>`<div class="info-row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");
document.getElementById("statsInfo").innerHTML=[["Vittorie",d.wins||0],["Podi",(d.wins||0)+(d.seconds||0)+(d.thirds||0)],["Pole position",d.poles||0],["Giri veloci",d.fastest||0],["Miglior risultato",d.bestResult||"—"],["Media punti",avg]].map(x=>`<div class="info-row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");
document.getElementById("rankingInfo").innerHTML=[["Classifica generale",generalPos+"°"],["Classifica "+d.category,catPos+"°"],["Classifica Gr.3",d.gr3Pos?d.gr3Pos+"°":"—"],["Classifica Gr.4",d.gr4Pos?d.gr4Pos+"°":"—"]].map(x=>`<div class="info-row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
