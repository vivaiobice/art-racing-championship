<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ART Racing · Scheda Gara</title><style>
:root{--bg:#080b10;--panel:#101722;--panel2:#0c1119;--line:#293242;--text:#f5f7fb;--muted:#a7b0c0;--red:#e31b23;--gold:#ffd24a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 10%,#182131 0,#080b10 42%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand{height:62px;max-width:180px;object-fit:contain}.back{color:#dbe1ea;text-decoration:none;font-weight:800;font-size:13px}.hero{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;background:linear-gradient(135deg,#121925,#0c1119);border:1px solid var(--line);border-radius:18px;padding:28px}.eyebrow{color:var(--red);font-weight:900;letter-spacing:.1em;font-size:12px}.hero h1{font-size:46px;margin:10px 0 12px}.meta{color:var(--muted);font-weight:700}.status{display:inline-block;margin-top:18px;border:1px solid var(--red);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.circuit{display:flex;align-items:center;justify-content:center;gap:24px;min-height:250px}.circuit-logo{max-width:170px;max-height:95px;object-fit:contain;background:#fff;border-radius:10px;padding:8px}.track-img{width:min(390px,55%);height:210px;object-fit:contain;background:#000;border-radius:12px;padding:10px;filter:drop-shadow(0 0 7px rgba(255,255,255,.08))}.tabs{display:flex;margin-top:20px;border:1px solid var(--line);border-radius:14px 14px 0 0;overflow:hidden}.tab{flex:1;padding:16px;background:#101722;color:var(--muted);border:0;font-weight:900;font-size:15px;cursor:pointer}.tab.active{color:#fff;background:rgba(227,27,35,.12);box-shadow:inset 0 -3px 0 var(--red)}.results{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:20px;background:#0d131c;overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.num{font-weight:950;border:1px solid #4a5568;border-radius:7px;padding:4px 7px}.empty{text-align:center;color:var(--muted);padding:48px 20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.mini{border:1px solid var(--line);border-radius:12px;padding:16px;background:#0d131c}.mini span{display:block;color:var(--red);font-size:11px;font-weight:900;text-transform:uppercase}.mini strong{display:block;margin-top:7px}.note{color:var(--muted);font-size:12px;margin:16px 2px}@media(max-width:760px){.wrap{padding:12px}.hero{grid-template-columns:1fr;padding:20px}.hero h1{font-size:34px}.circuit{min-height:180px;gap:10px}.circuit-logo{max-width:115px}.track-img{width:60%;height:160px}.cards{grid-template-columns:1fr}.brand{height:48px}}
</style></head><body><div class="wrap"><div class="top"><a class="back" href="index.html#calendario">← TORNA AL CALENDARIO</a><img class="brand" src="ART_REPARTO_CORSE.png" alt="ART Racing Team"></div><section class="hero"><div><div class="eyebrow" id="cat"></div><h1 id="title"></h1><div class="meta" id="date"></div><div class="status" id="status"></div></div><div class="circuit"><img class="circuit-logo" id="circuitLogo" alt="Logo circuito"><img class="track-img" id="trackImg" alt="Mappa circuito"></div></section><div class="tabs"><button class="tab active" id="qtab" onclick="showTab('q')">QUALIFICA</button><button class="tab" id="rtab" onclick="showTab('r')">GARA</button></div><section class="results" id="results"></section><div class="cards"><div class="mini"><span>Pole position</span><strong id="pole">—</strong></div><div class="mini"><span>Giro veloce gara</span><strong id="fast">—</strong></div><div class="mini"><span>Vincitore gara</span><strong id="winner">—</strong></div></div><div class="note">I risultati saranno aggiornati dagli screenshot ufficiali di qualifica e gara. L'assenza dal risultato gara determina la non partecipazione all'evento.</div></div><script>
const races=[{n:1,c:"Monza",cat:"GR3",date:"2026-09-11T21:45:00+02:00",key:"monza"},{n:2,c:"Spa-Francorchamps",cat:"GR3",date:"2026-09-18T21:45:00+02:00",key:"spa"},{n:3,c:"Nürburgring GP",cat:"GR3",date:"2026-09-25T21:45:00+02:00",key:"nurburgring"},{n:4,c:"Red Bull Ring",cat:"GR3",date:"2026-10-02T21:45:00+02:00",key:"redbull"},{n:5,c:"Suzuka",cat:"GR3",date:"2026-10-09T21:45:00+02:00",key:"suzuka"},{n:6,c:"Monza",cat:"GR4",date:"2026-10-16T21:45:00+02:00",key:"monza"},{n:7,c:"Spa-Francorchamps",cat:"GR4",date:"2026-10-23T21:45:00+02:00",key:"spa"},{n:8,c:"Nürburgring GP",cat:"GR4",date:"2026-10-30T21:45:00+01:00",key:"nurburgring"},{n:9,c:"Red Bull Ring",cat:"GR4",date:"2026-11-06T21:45:00+01:00",key:"redbull"},{n:10,c:"Suzuka",cat:"GR4",date:"2026-11-13T21:45:00+01:00",key:"suzuka"}];
const logos={monza:"assets/monza-logo.png",spa:"assets/spa-logo.png",nurburgring:"assets/nurburgring-logo.png",redbull:"assets/redbull-logo.png",suzuka:"assets/suzuka-logo.png"};const trackImages={monza:"assets/monza-track.png",spa:"assets/spa-track.png",nurburgring:"assets/nurburgring-track.png",redbull:"assets/redbull-track.png",suzuka:"assets/suzuka-track.png"};
const qualifyingResults={}, raceResults={};
const n=Number(new URLSearchParams(location.search).get('gara')||1), r=races.find(x=>x.n===n)||races[0];
document.title=`ART Racing · Gara ${r.n} ${r.c}`;document.getElementById('cat').textContent=`CATEGORIA ${r.cat}`;document.getElementById('title').textContent=`GARA ${r.n} · ${r.c.toUpperCase()}`;document.getElementById('date').textContent=new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'}).format(new Date(r.date));document.getElementById('circuitLogo').src=logos[r.key];document.getElementById('trackImg').src=trackImages[r.key];const now=new Date(), future=races.filter(x=>new Date(x.date)>now), next=future.length&&future[0].n===r.n;document.getElementById('status').textContent=new Date(r.date)<=now?'CONCLUSA':next?'PROSSIMA':'PROGRAMMATA';
function table(rows,type){if(!rows||!rows.length)return `<div class="empty">Risultati ${type==='q'?'di qualifica':'di gara'} non ancora disponibili.</div>`;const q=type==='q';return `<table><thead><tr><th>Pos.</th><th>#</th><th>Pilota</th><th>PSN ID</th><th>Scuderia</th><th>${q?'Tempo qualifica':'Tempo / distacco'}</th>${q?'<th>Distacco</th>':'<th>Giro veloce</th><th>Punti</th>'}</tr></thead><tbody>${rows.map(x=>`<tr><td>${x.pos}</td><td><span class="num">#${x.number}</span></td><td><strong>${x.driver}</strong></td><td>${x.psn||'—'}</td><td>${x.team||'—'}</td><td>${x.time||x.gap||'—'}</td>${q?`<td>${x.gap||'—'}</td>`:`<td>${x.fast||'—'}</td><td><strong>${x.points??'—'}</strong></td>`}</tr>`).join('')}</tbody></table>`}
function showTab(t){document.getElementById('qtab').classList.toggle('active',t==='q');document.getElementById('rtab').classList.toggle('active',t==='r');document.getElementById('results').innerHTML=table(t==='q'?qualifyingResults[r.n]:raceResults[r.n],t)}showTab('q');
</script></body></html>
